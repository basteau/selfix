name: Website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm docs:build
        env:
          DOCS_SITE_URL: https://selfix.dev
      - name: Stamp verified artifact
        run: |
          mkdir -p apps/docs/dist/.well-known
          printf '%s\n' "$GITHUB_SHA" > apps/docs/dist/.well-known/selfix-release.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: selfix-website
          path: apps/docs/dist
          include-hidden-files: true
          if-no-files-found: error
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.EXE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: website
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: selfix-website
          path: apps/docs/dist
      - name: Deploy verified static files
        env:
          EXE_HOST: ${{ vars.EXE_HOST }}
          EXE_SSH_KEY: ${{ secrets.EXE_SSH_KEY }}
          EXE_KNOWN_HOSTS: ${{ secrets.EXE_KNOWN_HOSTS }}
        run: bash scripts/deploy-website.sh
