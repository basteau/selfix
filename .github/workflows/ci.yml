name: CI
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check Conventional Commit PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict"
          assert.match(
            process.env.PR_TITLE,
            /^(feat|fix|perf|refactor|docs|build|test|chore|ci|style|revert|types)(\([^()\r\n]+\))?!?: \S[^\r\n]*$/,
            "Use a Conventional Commit title, e.g. fix(cli): report invalid configuration",
          )
          NODE
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate release tag and metadata
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-release.mjs
      - run: pnpm check
      - name: Pack the checked release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pnpm --filter selfix pack --out "$RUNNER_TEMP/selfix.tgz"
          npm publish "$RUNNER_TEMP/selfix.tgz" --dry-run --ignore-scripts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: selfix-package
          path: ${{ runner.temp }}/selfix.tgz
          if-no-files-found: error

  publish:
    needs: check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: selfix-package
          path: ${{ runner.temp }}/selfix-package
      - name: Publish the checked tarball with npm trusted publishing
        run: npm publish "$RUNNER_TEMP/selfix-package/selfix.tgz" --access public --provenance --ignore-scripts
