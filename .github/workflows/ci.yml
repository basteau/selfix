name: CI
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      npm_tag: ${{ steps.release.outputs.npm_tag }}
      vue: ${{ steps.peers.outputs.vue }}
      tailwindcss: ${{ steps.peers.outputs.tailwindcss }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check Conventional Commit PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict"
          assert.match(
            process.env.PR_TITLE,
            /^(feat|fix|perf|refactor|docs|build|test|chore|ci|style|revert|types)(\([^()\r\n]+\))?!?: \S[^\r\n]*$/,
            "Use a Conventional Commit title, e.g. fix(cli): report invalid configuration",
          )
          NODE
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate release tag and metadata
        id: release
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-release.mjs "$RUNNER_TEMP/release-notes.md"
      - run: pnpm check
      - name: Record locked consumer peers
        id: peers
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs"
          import { createRequire } from "node:module"
          const require = createRequire(import.meta.url)
          for (const name of ["vue", "tailwindcss"]) {
            appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${require(`${name}/package.json`).version}\n`)
          }
          NODE
      - name: Pack and smoke-test the checked package
        run: |
          pnpm --filter selfix pack --out "$RUNNER_TEMP/selfix.tgz"
          pnpm smoke:package "$RUNNER_TEMP/selfix.tgz"
      - name: Dry-run the verified release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          NPM_TAG: ${{ steps.release.outputs.npm_tag }}
        run: |
          npm publish "$RUNNER_TEMP/selfix.tgz" --tag "$NPM_TAG" --dry-run --ignore-scripts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: selfix-package
          path: |
            ${{ runner.temp }}/selfix.tgz
            ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

  compatibility:
    needs: check
    name: Packed consumer / ${{ matrix.os }} / Node ${{ matrix.node }} / ${{ matrix.peers }} peers
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22.18.0"
            peers: minimum
          - os: macos-latest
            node: "22.18.0"
            peers: minimum
          - os: macos-latest
            node: "24"
            peers: workspace
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: selfix-package
          path: ${{ runner.temp }}/selfix-package
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Verify the checked tarball with target Node and peers
        env:
          PEERS: ${{ matrix.peers }}
          VUE_VERSION: ${{ needs.check.outputs.vue }}
          TAILWIND_VERSION: ${{ needs.check.outputs.tailwindcss }}
        run: |
          node --version
          npm --version
          if [ "$PEERS" = minimum ]; then
            node packages/selfix/scripts/smoke-install.mjs "$RUNNER_TEMP/selfix-package/selfix.tgz" 3.2.13 4.0.0
          else
            node packages/selfix/scripts/smoke-install.mjs "$RUNNER_TEMP/selfix-package/selfix.tgz" "$VUE_VERSION" "$TAILWIND_VERSION"
          fi

  publish:
    needs: [check, compatibility]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: selfix-package
          path: ${{ runner.temp }}/selfix-package
      - name: Publish the checked tarball with npm trusted publishing
        env:
          NPM_TAG: ${{ needs.check.outputs.npm_tag }}
        run: npm publish "$RUNNER_TEMP/selfix-package/selfix.tgz" --tag "$NPM_TAG" --access public --provenance --ignore-scripts

  github-release:
    needs: [check, compatibility, publish]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.check.result == 'success' && needs.compatibility.result == 'success' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: github-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: selfix-package
          path: ${{ runner.temp }}/selfix-package
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          NPM_TAG: ${{ needs.check.outputs.npm_tag }}
        run: |
          case "$NPM_TAG" in
            alpha|beta) flags=(--prerelease --latest=false) ;;
            latest) flags=(--latest) ;;
            *) echo "Invalid release channel: $NPM_TAG" >&2; exit 1 ;;
          esac
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub release already exists: $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/selfix-package/release-notes.md" \
              "${flags[@]}"
          fi
